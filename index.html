<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>期货五维一体投研分析知识库</title>
<style>
  :root {
    --bg: #f8f9fb;
    --card-bg: #fff;
    --text: #2c3e50;
    --text-secondary: #5a6c7d;
    --border: #e8ecf1;
    --primary: #1a5276;
    --accent: #2980b9;
    --red: #c0392b;
    --green: #27ae60;
    --yellow: #f39c12;
    --tab-active: #e8f4fd;
    --tab-hover: #f0f4f8;
    --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
    --radius: 8px;
    --dim-basic: #3498db;
    --dim-macro: #e74c3c;
    --dim-tech: #f39c12;
    --dim-capital: #9b59b6;
    --dim-sentiment: #1abc9c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    min-height: 100vh;
  }

  /* Header */
  .header {
    background: linear-gradient(135deg, #1a3a4a 0%, #1a5276 50%, #1a3a4a 100%);
    color: #fff;
    padding: 16px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-title {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 1px;
  }
  .header-title span {
    font-size: 13px;
    font-weight: 400;
    opacity: 0.75;
    margin-left: 10px;
    letter-spacing: 0;
  }

  /* Exchange Tabs */
  .exchange-tabs {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
    justify-content: flex-end;
  }
  .exchange-tab {
    padding: 6px 14px;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
    border: 1px solid rgba(255,255,255,0.2);
    background: transparent;
    color: rgba(255,255,255,0.8);
    white-space: nowrap;
  }
  .exchange-tab:hover { 
    background: rgba(255,255,255,0.12); 
    color: #fff;
    border-color: rgba(255,255,255,0.4);
  }
  .exchange-tab.active {
    background: rgba(255,255,255,0.2);
    color: #fff;
    font-weight: 600;
    border-color: rgba(255,255,255,0.5);
  }

  /* Main Layout */
  .main-container {
    display: flex;
    max-width: 1400px;
    margin: 0 auto;
    min-height: calc(100vh - 120px);
  }

  /* Sidebar */
  .sidebar {
    width: 320px;
    min-width: 320px;
    background: var(--card-bg);
    border-right: 1px solid var(--border);
    padding: 20px;
    overflow-y: auto;
    max-height: calc(100vh - 60px);
    position: sticky;
    top: 60px;
    transition: all 0.3s ease;
    position: relative;
  }
  .sidebar.collapsed {
    width: 0;
    min-width: 0;
    padding: 0;
    border-right: none;
    overflow: hidden;
  }
  .sidebar-toggle {
    position: absolute;
    right: -28px;
    top: 50%;
    transform: translateY(-50%);
    width: 28px;
    height: 60px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-left: none;
    border-radius: 0 6px 6px 0;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    color: var(--text-secondary);
    z-index: 10;
    transition: all 0.2s;
  }
  .sidebar-toggle:hover { 
    background: var(--tab-hover); 
    color: var(--accent);
  }
  .sidebar.collapsed .sidebar-toggle {
    right: auto;
    left: 100%;
    border-radius: 0 6px 6px 0;
    border-left: 1px solid var(--border);
  }
  /* floating toggle when collapsed */
  .sidebar-floating-toggle {
    display: none;
    position: fixed;
    left: 0;
    top: 50%;
    transform: translateY(-50%);
    width: 28px;
    height: 60px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-left: none;
    border-radius: 0 6px 6px 0;
    cursor: pointer;
    z-index: 50;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    color: var(--text-secondary);
    transition: all 0.2s;
    box-shadow: 2px 0 6px rgba(0,0,0,0.08);
  }
  .sidebar-floating-toggle:hover { 
    background: var(--tab-hover); 
    color: var(--accent);
  }
  .sidebar-floating-toggle.visible {
    display: flex;
  }
  .sidebar-section {
    margin-bottom: 24px;
  }
  .sidebar-exchange-title {
    font-size: 14px;
    font-weight: 700;
    color: var(--primary);
    padding: 6px 0;
    border-bottom: 2px solid var(--accent);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .sidebar-exchange-title .count {
    font-size: 11px;
    font-weight: 400;
    color: var(--text-secondary);
    background: #f0f4f8;
    padding: 2px 8px;
    border-radius: 10px;
  }
  .commodity-item {
    padding: 7px 10px;
    margin: 2px 0;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    justify-content: space-between;
    color: var(--text);
  }
  .commodity-item:hover { background: var(--tab-hover); }
  .commodity-item.active {
    background: var(--tab-active);
    color: var(--accent);
    font-weight: 600;
  }
  .commodity-item .tag {
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 3px;
    background: #e8ecf1;
    color: var(--text-secondary);
  }
  .commodity-item.active .tag { background: #d4e6f1; color: var(--accent); }

  /* Content */
  .content {
    flex: 1;
    padding: 28px;
    overflow-y: auto;
  }
  .content-empty {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 60vh;
    color: var(--text-secondary);
    font-size: 16px;
    flex-direction: column;
    gap: 12px;
  }

  /* Variety Header */
  .variety-header {
    margin-bottom: 28px;
  }
  .variety-title {
    font-size: 26px;
    font-weight: 800;
    color: var(--primary);
    margin-bottom: 6px;
  }
  .variety-meta {
    font-size: 13px;
    color: var(--text-secondary);
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }
  .variety-meta span {
    background: #f0f4f8;
    padding: 3px 10px;
    border-radius: 4px;
  }

  /* Content Tabs (基础知识 / 五维一体) */
  .content-tabs {
    display: flex;
    gap: 0;
    margin-bottom: 24px;
    border-bottom: 2px solid var(--border);
  }
  .content-tab {
    padding: 10px 24px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    color: var(--text-secondary);
    border-bottom: 2px solid transparent;
    margin-bottom: -2px;
    transition: all 0.2s;
    position: relative;
  }
  .content-tab:hover { color: var(--accent); }
  .content-tab.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }
  .content-tab .tab-count {
    font-size: 11px;
    font-weight: 400;
    color: var(--text-secondary);
    margin-left: 6px;
    opacity: 0.7;
  }
  .content-tab-panel { display: none; }
  .content-tab-panel.active { display: block; }

  /* Five-dim weight overview */
  .weight-overview {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 12px;
    margin-bottom: 32px;
  }
  .weight-card {
    background: var(--card-bg);
    border-radius: var(--radius);
    padding: 16px;
    text-align: center;
    box-shadow: var(--shadow);
    border-top: 3px solid transparent;
    cursor: pointer;
    transition: all 0.2s;
  }
  .weight-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
  .weight-card:nth-child(1) { border-top-color: var(--dim-basic); }
  .weight-card:nth-child(2) { border-top-color: var(--dim-macro); }
  .weight-card:nth-child(3) { border-top-color: var(--dim-tech); }
  .weight-card:nth-child(4) { border-top-color: var(--dim-capital); }
  .weight-card:nth-child(5) { border-top-color: var(--dim-sentiment); }
  .weight-card .dim-name {
    font-size: 13px;
    color: var(--text-secondary);
    margin-bottom: 4px;
    white-space: nowrap;
  }
  .weight-card .dim-weight {
    font-size: 32px;
    font-weight: 800;
  }
  .weight-card:nth-child(1) .dim-weight { color: var(--dim-basic); }
  .weight-card:nth-child(2) .dim-weight { color: var(--dim-macro); }
  .weight-card:nth-child(3) .dim-weight { color: var(--dim-tech); }
  .weight-card:nth-child(4) .dim-weight { color: var(--dim-capital); }
  .weight-card:nth-child(5) .dim-weight { color: var(--dim-sentiment); }
  .weight-card .dim-subtitle {
    font-size: 11px;
    color: var(--text-secondary);
    margin-top: 2px;
  }

  /* Dimension Section */
  .dim-section {
    background: var(--card-bg);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    margin-bottom: 24px;
    overflow: hidden;
  }
  .dim-section-header {
    padding: 16px 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-left: 4px solid transparent;
    transition: all 0.2s;
  }
  .dim-section-header:hover { background: #fafbfc; }
  .dim-section:nth-child(1) .dim-section-header { border-left-color: var(--dim-basic); }
  .dim-section:nth-child(2) .dim-section-header { border-left-color: var(--dim-macro); }
  .dim-section:nth-child(3) .dim-section-header { border-left-color: var(--dim-tech); }
  .dim-section:nth-child(4) .dim-section-header { border-left-color: var(--dim-capital); }
  .dim-section:nth-child(5) .dim-section-header { border-left-color: var(--dim-sentiment); }
  .dim-section-title {
    font-size: 17px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .dim-section-title .dim-badge {
    font-size: 12px;
    padding: 2px 10px;
    border-radius: 12px;
    font-weight: 600;
    color: #fff;
  }
  .badge-basic { background: var(--dim-basic); }
  .badge-macro { background: var(--dim-macro); }
  .badge-tech { background: var(--dim-tech); }
  .badge-capital { background: var(--dim-capital); }
  .badge-sentiment { background: var(--dim-sentiment); }
  .dim-section-arrow {
    font-size: 14px;
    transition: transform 0.2s;
    color: var(--text-secondary);
  }
  .dim-section.expanded .dim-section-arrow { transform: rotate(180deg); }
  .dim-section-body { display: none; padding: 0 20px 20px; }
  .dim-section.expanded .dim-section-body { display: block; }

  .dim-intro {
    color: var(--text-secondary);
    font-size: 14px;
    margin-bottom: 16px;
    line-height: 1.7;
    padding: 12px 16px;
    background: #f8fafc;
    border-radius: 6px;
    border-left: 3px solid #dde;
  }

  /* Sub-dimension */
  .sub-dim {
    margin-bottom: 20px;
  }
  .sub-dim-title {
    font-size: 15px;
    font-weight: 700;
    color: var(--primary);
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .sub-dim-title .sub-weight {
    font-size: 12px;
    background: #e8f4fd;
    color: var(--accent);
    padding: 2px 8px;
    border-radius: 10px;
    font-weight: 600;
  }
  .sub-dim-logic {
    font-size: 13px;
    color: var(--text-secondary);
    margin-bottom: 12px;
    padding-left: 4px;
  }
  .sub-dim-logic ul {
    margin: 4px 0 0 16px;
    line-height: 1.7;
  }

  /* Indicator Table */
  .indicator-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    margin-bottom: 16px;
  }
  .indicator-table th {
    background: #f0f4f8;
    padding: 10px 12px;
    text-align: left;
    font-weight: 600;
    color: var(--text);
    font-size: 12px;
    border-bottom: 2px solid #dde;
  }
  .indicator-table td {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
    line-height: 1.5;
  }
  .indicator-table tr:hover td { background: #fafbfc; }
  .weight-cell {
    font-weight: 700;
    text-align: center;
    white-space: nowrap;
  }
  .freq-tag {
    display: inline-block;
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 3px;
    font-weight: 600;
    white-space: nowrap;
  }
  .freq-daily { background: #fef9e7; color: #b7950b; }
  .freq-weekly { background: #eaf2f8; color: #2471a3; }
  .freq-monthly { background: #e8f8f5; color: #1e8449; }
  .freq-quarterly { background: #f4ecf7; color: #7d3c98; }
  .freq-event { background: #fdedec; color: #b03a2e; }
  .source-tag {
    font-size: 11px;
    color: var(--text-secondary);
    background: #f8f9fb;
    padding: 1px 6px;
    border-radius: 3px;
    white-space: nowrap;
  }

  /* Impact pathway */
  .pathway {
    background: #f8fafc;
    border-radius: var(--radius);
    padding: 20px;
    margin-top: 16px;
    font-family: "SF Mono", "Consolas", "Microsoft YaHei", monospace;
    font-size: 13px;
    line-height: 1.8;
    white-space: pre-wrap;
    color: var(--text);
    border: 1px solid var(--border);
  }

  /* Score Card */
  .score-section {
    background: var(--card-bg);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 24px;
    margin-bottom: 24px;
  }
  .score-title {
    font-size: 17px;
    font-weight: 700;
    margin-bottom: 16px;
    color: var(--primary);
  }
  .score-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 12px;
  }
  .score-card {
    padding: 14px;
    border-radius: 6px;
    background: #f8fafc;
    text-align: center;
  }
  .score-card .score-range {
    font-size: 12px;
    color: var(--text-secondary);
    margin-bottom: 4px;
  }
  .score-card .score-action {
    font-size: 14px;
    font-weight: 700;
    color: var(--primary);
  }

  /* Characteristics */
  .char-list {
    list-style: none;
    padding: 0;
  }
  .char-list li {
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
    display: flex;
    gap: 8px;
    align-items: baseline;
  }
  .char-list li .num {
    font-weight: 700;
    color: var(--accent);
    min-width: 20px;
  }

  /* TOC */
  .toc {
    background: var(--card-bg);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px;
    margin-bottom: 28px;
  }
  .toc-title {
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 12px;
    color: var(--primary);
  }
  .toc-list {
    list-style: none;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .toc-list li a {
    font-size: 13px;
    color: var(--accent);
    text-decoration: none;
    padding: 4px 12px;
    border-radius: 4px;
    background: #f0f4f8;
    transition: all 0.15s;
  }
  .toc-list li a:hover { background: #d4e6f1; }

  /* Responsive */
  @media (max-width: 900px) {
    .main-container { flex-direction: column; }
    .sidebar {
      width: 100%;
      min-width: 100%;
      max-height: none;
      position: static;
      border-right: none;
      border-bottom: 1px solid var(--border);
      padding: 16px;
    }
    .weight-overview { grid-template-columns: repeat(3, 1fr); }
    .exchange-tabs { flex-wrap: wrap; gap: 2px; }
    .exchange-tab { font-size: 11px; padding: 4px 8px; }
  }
  @media (max-width: 600px) {
    .weight-overview { grid-template-columns: repeat(2, 1fr); }
    .header { flex-direction: column; gap: 8px; }
    .exchange-tabs { justify-content: center; }
  }

  /* Search */
  .search-box {
    margin-bottom: 16px;
    position: relative;
  }
  .search-box input {
    width: 100%;
    padding: 8px 12px 8px 32px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 13px;
    outline: none;
    transition: border-color 0.2s;
  }
  .search-box input:focus { border-color: var(--accent); }
  .search-box::before {
    content: "🔍";
    position: absolute;
    left: 8px;
    top: 7px;
    font-size: 13px;
    opacity: 0.5;
    pointer-events: none;
  }

  .highlight-dim { background: #eaf2f8; padding: 2px 4px; border-radius: 2px; }

  /* Summary weight table */
  .summary-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  .summary-table th {
    background: var(--primary);
    color: #fff;
    padding: 10px;
    text-align: center;
    font-weight: 600;
    font-size: 12px;
  }
  .summary-table td {
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
    text-align: center;
  }
  .summary-table tr:hover td { background: #fafbfc; }
  .summary-table .dim-header {
    font-weight: 700;
    text-align: left;
  }

    .chart-container { background:#fff; border-radius:10px; padding:16px; margin-bottom:20px; box-shadow:0 2px 8px rgba(0,0,0,0.06); }
    .chart-title { font-size:15px; font-weight:700; color:var(--text-primary); margin-bottom:8px; display:flex; align-items:center; gap:8px; }
    .chart-wrapper { position:relative; width:100%; }
    .chart-row { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    @media (max-width:768px) { .chart-row { grid-template-columns:1fr; } }


    .chart-section-header { background:linear-gradient(135deg,#f8f9fa,#fff); border-radius:8px; padding:10px 16px; margin:20px 0 12px; font-size:14px; font-weight:700; display:flex; align-items:center; gap:8px; border-left:3px solid #2c3e50; }
</style>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>

<!-- Header -->
<div class="header">
  <div class="header-title">
    📊 期货五维一体投研分析知识库
    <span>Futures Research Knowledge Base</span>
  </div>
  <div class="exchange-tabs" id="exchangeTabs">
    <div class="exchange-tab active" data-exchange="all">全部品种</div>
    <div class="exchange-tab" data-exchange="SHFE">上海期货交易所</div>
    <div class="exchange-tab" data-exchange="DCE">大连商品交易所</div>
    <div class="exchange-tab" data-exchange="CZCE">郑州商品交易所</div>
    <div class="exchange-tab" data-exchange="GFEX">广州期货交易所</div>
    <div class="exchange-tab" data-exchange="INE">上海国际能源交易中心</div>
    <div class="exchange-tab" data-exchange="CFFEX">中国金融期货交易所</div>
  </div>
</div>

<!-- Main -->
<div class="main-container">
  <!-- Sidebar -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-toggle" onclick="toggleSidebar()" title="收起/展开品种栏">◀</div>
    <div class="search-box">
      <input type="text" placeholder="搜索品种..." id="searchInput" onkeyup="filterCommodities()">
    </div>
    <div id="commodityList"></div>
    <div style="border-top:1px solid var(--border-color, #e0e0e0); padding:12px 16px; margin-top:8px;">
      <div style="font-size:11px; color:var(--text-secondary, #999); margin-bottom:6px; letter-spacing:1px;">📡 数据来源</div>
      <a href="https://qihuo.jin10.com/" target="_blank" style="display:block; font-size:12px; color:#2a6cb6; text-decoration:none; padding:4px 0;" onmouseover="this.style.color='#e74c3c'" onmouseout="this.style.color='#2a6cb6'">金十期货 · 实时快讯</a>
      <a href="https://finance.sina.com.cn/futures/" target="_blank" style="display:block; font-size:12px; color:#2a6cb6; text-decoration:none; padding:4px 0;" onmouseover="this.style.color='#e74c3c'" onmouseout="this.style.color='#2a6cb6'">新浪财经 · 期货行情</a>
    </div>
  </div>

  <!-- Floating toggle when sidebar collapsed -->
  <div class="sidebar-floating-toggle" id="floatingToggle" onclick="toggleSidebar()" title="展开品种栏">▶</div>

  <!-- Content -->
  <div class="content" id="content">
    <div class="content-empty">
      <div style="font-size: 48px;">📊</div>
      <div>请从左侧选择一个期货品种查看详细投研分析</div>

// ==================== RENDER SIDEBAR ====================
function renderSidebar() {
  const list = document.getElementById('commodityList');
  let html = '';
  
  const exKeys = currentExchange === 'all' 
    ? Object.keys(exchanges) 
    : [currentExchange];
  
  for (const key of exKeys) {
    const ex = exchanges[key];
    let filtered = ex.commodities;
    
    // Apply search
    const searchTerm = document.getElementById('searchInput').value.toLowerCase();
    if (searchTerm) {
      filtered = filtered.filter(c => 
        c.name.toLowerCase().includes(searchTerm) || 
        c.code.toLowerCase().includes(searchTerm) ||
        c.group.includes(searchTerm)
      );
    }
    
    if (filtered.length === 0) continue;
    
    html += `<div class="sidebar-section">
      <div class="sidebar-exchange-title">
        ${ex.name}
        <span class="count">${filtered.length}个品种</span>
      </div>`;
    
    for (const c of filtered) {
      const isActive = currentCommodity && currentCommodity.code === c.code;
      html += `<div class="commodity-item${isActive ? ' active' : ''}" 
                onclick="selectCommodity('${key}', '${c.code}')">
        <span>${c.name}${c.paused ? '（暂停）' : ''}</span>
        <span class="tag">${c.code}</span>
      </div>`;
    }
    html += '</div>';
  }
  
  list.innerHTML = html || '<div style="color: #999; font-size:13px; padding:10px;">未找到匹配品种</div>';
}

function switchContentTab(tab, el) {

    <div class="score-section">
      <div class="score-title">五、品种特性与指标选取逻辑</div>
      <ul class="char-list">
        <li><span class="num">1</span><b>产能天花板构成绝对供给刚性：</b>中国电解铝合规产能上限4500万吨，新增产能需等量或减量置换。当前运行产能已接近上限，供给端缺乏弹性。这是决定铝价长期走势的最核心基本面。</li>
        <li><span class="num">2</span><b>电力成本占比高，季节性扰动显著：</b>电解铝是典型的高耗能行业（吨铝耗电13,500kWh），电力成本占总成本35%+。云南水电产能约占总产能12%，枯水期(11-4月)季节性限产是重要供给变量。</li>
        <li><span class="num">3</span><b>需求结构正向新能源转型：</b>建筑用铝占比从35%下降至28%，新能源车（单车200kg vs 燃油车140kg）+光伏支架边框用铝快速增长，消费结构优化为铝提供中长期需求增量。</li>
        <li><span class="num">4</span><b>跨市场联动紧密：</b>上期所(SHFE)和伦敦金属交易所(LME)铝价高度联动，沪伦比价(正常区间7.0-8.5)影响进出口套利行为。LME铝是全球定价锚。</li>

      </p>

function selectCommodity(exchangeKey, code) {
  currentCommodity = { exchange: exchangeKey, code: code };
  
  if (exchangeKey === 'DCE' && code === 'I') {
    renderIronOreDetail();
  } else if (exchangeKey === 'DCE' && code === 'LH') {
    renderPigDetail();
  } else if (exchangeKey === 'CZCE' && code === 'UR') {
    renderUreaDetail();
  } else if (exchangeKey === 'SHFE' && code === 'AL') {
    renderAluminumDetail();
  } else if (exchangeKey === 'DCE' && code === 'J') {
    renderCokeDetail();
  } else if (exchangeKey === 'CZCE' && code === 'PK') {
    renderPeanutDetail();
  } else {
    const ex = exchanges[exchangeKey];
    const commodity = ex.commodities.find(c => c.code === code);
    const cname = commodity ? commodity.name : code;
    document.getElementById('content').innerHTML = `
      <div class="variety-header">
        <div class="variety-title">${cname} (${code})</div>
        <div class="variety-meta">
          <span>📂 品种代码：${code}</span>
          <span>🏢 交易所：${ex.name}</span>
          <span>📂 品种集群：${commodity ? commodity.group : ''}</span>
        </div>
      </div>
      <div class="content-empty" style="height:40vh;">
        <div style="font-size: 48px;">🚧</div>
        <div><b>${cname}</b> - 品种知识库建设中</div>
        <div style="font-size: 13px; color: #aaa;">当前已完善：铁矿石、焦炭、生猪、尿素、花生、铝六品种分析</div>
      </div>`;
  }
}
